; REDLINE — racing dash for the CYD (ESP32-2432S028R-family, 2.8" ILI9341 + XPT2046)
;
;   pio run -e esp32dev      -t upload --upload-port /dev/cu.usbserial-XXXX   (panel needs inversion)
;   pio run -e cyd-noinvert  -t upload --upload-port /dev/cu.usbserial-XXXX   (normal panel)
;   pio device monitor
;
; Theme, data source (SIM / TOUCH / SERIAL / OBD BT / CUSTOM), shift point and
; brightness are chosen at runtime on the SETUP page or over serial — see README.md.
;   pio test -e native      host unit tests (no board needed)

[common]
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
board     = esp32dev
framework = arduino
monitor_speed = 115200
; The 150 KB background image + Bluetooth Classic stack do not fit in the
; default 1.2 MB app slot. No OTA needed, so use the 3 MB single-app layout.
board_build.partitions = huge_app.csv

build_flags =
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=240
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=12
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D TOUCH_CS=33
    -D SPI_FREQUENCY=65000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000
    -D LOAD_GLCD=1
    -D SMOOTH_FONT=1
    -I src

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    https://github.com/Bodmer/TFT_Touch.git

; original board: colours are wrong without inversion
[env:esp32dev]
extends = common
build_flags =
    ${common.build_flags}
    -D TFT_INVERSION_ON=1

; second board: panel shows correct colours as-is
[env:cyd-noinvert]
extends = common
build_flags =
    ${common.build_flags}
    -D TFT_INVERSION_OFF=1

; Host unit tests for everything that isn't hardware: parsers, model, renderer,
; settings page, simulator, theme assets.   pio test -e native
[env:native]
platform = native
test_build_src = yes
build_src_filter =
    -<*>
    +<ui/canvas.cpp> +<ui/gauge_model.cpp> +<ui/gauge_ui.cpp> +<ui/settings_ui.cpp> +<ui/splash_ui.cpp> +<ui/theme.cpp>
    +<data/gauge_bus.cpp> +<data/sim_source.cpp> +<data/serial_source.cpp>
build_flags = -std=gnu++17 -I src -Wall
