<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<defs><pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#16202a"/></pattern><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#4fd2ff"/></marker><style>text{font-family:Arial,sans-serif}.t{font-family:'Arial Narrow',Arial,sans-serif;font-weight:700}.m{font-family:Menlo,Consolas,monospace}.box{fill:#11181e;stroke:#53616b;stroke-width:2}.wire{fill:none;stroke:#4fd2ff;stroke-width:4;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#a)}.lime{fill:#b6ff00}.muted{fill:#8796a0}</style></defs>
<rect width="1200" height="760" fill="#0b0f13"/><rect x="32" y="32" width="1136" height="696" rx="16" fill="url(#g)" stroke="#27333c" stroke-width="2"/><path d="M32 108V48q0-16 16-16h250" fill="none" stroke="#b6ff00" stroke-width="5"/>
<text x="64" y="82" fill="white" font-size="34" letter-spacing="1" class="t">REDLINE — WHERE THE DATA COMES FROM</text><text x="64" y="110" class="muted" font-size="18">Inputs, wireless data, and outputs at a glance</text>
<g font-size="16"><rect class="box" x="72" y="150" width="350" height="72" rx="12"/><text class="m lime" x="94" y="180">SIM / TOUCH</text><text class="m muted" x="94" y="204">built in, no wiring</text>
<rect class="box" x="72" y="250" width="350" height="94" rx="12"/><text class="m lime" x="94" y="280">OBD-II port → ELM327</text><text class="m" fill="white" x="94" y="306">Bluetooth Classic, not BLE</text>
<rect class="box" x="72" y="372" width="350" height="94" rx="12"/><text class="m lime" x="94" y="402">PC / Arduino</text><text class="m" fill="white" x="94" y="428">USB-C or GPIO 27</text><text class="m muted" x="94" y="452">serial, 115200</text>
<rect class="box" x="72" y="494" width="350" height="94" rx="12"/><text class="m lime" x="94" y="524">Your sensors</text><text class="m" fill="white" x="94" y="550">GPIO 35 / GPIO 22</text><text class="m muted" x="94" y="574">CUSTOM</text></g>
