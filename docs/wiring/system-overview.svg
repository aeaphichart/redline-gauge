<rect x="64" y="630" width="1072" height="58" rx="10" fill="#171c14" stroke="#b6ff00" stroke-width="2"/><text x="88" y="667" fill="white" font-size="18" class="m">Power: <tspan fill="#ff2424">USB-C 5 V</tspan> (car USB charger) — never connect 12 V to the board</text>
