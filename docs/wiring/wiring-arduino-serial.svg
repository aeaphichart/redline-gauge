<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><defs><pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#16202a"/></pattern><style>text{font-family:Arial,sans-serif}.t{font-family:'Arial Narrow',Arial,sans-serif;font-weight:700}.m{font-family:Menlo,Consolas,monospace}.b{fill:#11181e;stroke:#53616b;stroke-width:2}.s{fill:none;stroke:#4fd2ff;stroke-width:4;stroke-linejoin:round;stroke-linecap:round}.gr{fill:none;stroke:#9aa5ae;stroke-width:4}.muted{fill:#8796a0}</style></defs><rect width="1200" height="760" fill="#0b0f13"/><rect x="32" y="32" width="1136" height="696" rx="16" fill="url(#g)" stroke="#27333c" stroke-width="2"/><path d="M32 108V48q0-16 16-16h250" fill="none" stroke="#b6ff00" stroke-width="5"/><text x="64" y="82" fill="white" font-size="34" class="t">ARDUINO UNO / NANO → CYD (SERIAL MODE)</text><text x="64" y="110" class="muted" font-size="18">Safe 5 V-to-3.3 V serial input using a resistor divider</text>
<rect class="b" x="72" y="190" width="210" height="240" rx="14"/><text class="m" x="98" y="226" fill="#b6ff00" font-size="18">ARDUINO</text><text class="m" x="98" y="274" fill="white" font-size="16">D1 (TX)</text><text class="m" x="98" y="390" fill="white" font-size="16">GND</text><rect x="268" y="258" width="16" height="16" fill="#b6ff00"/><rect x="268" y="374" width="16" height="16" fill="#9aa5ae"/>
<path class="s" d="M284 266H352"/><rect x="352" y="245" width="110" height="42" rx="10" fill="#182028" stroke="#4fd2ff" stroke-width="2"/><text class="m" x="407" y="272" text-anchor="middle" fill="white" font-size="16">1 kΩ</text><path class="s" d="M462 266H558V322H748"/><circle cx="558" cy="266" r="6" fill="#4fd2ff"/><text class="m" x="576" y="248" fill="#ff8a00" font-size="16">J  ≈ 3.3 V</text><path class="s" d="M558 266V350"/><rect x="503" y="350" width="110" height="42" rx="10" fill="#182028" stroke="#4fd2ff" stroke-width="2"/><text class="m" x="558" y="377" text-anchor="middle" fill="white" font-size="16">2 kΩ</text><path class="gr" d="M558 392V500"/><path class="gr" d="M284 382V500H740V382"/><circle cx="558" cy="500" r="6" fill="#9aa5ae"/><path d="M520 500h76m-62 12h48m-34 12h20" stroke="#9aa5ae" stroke-width="3"/>
<rect x="748" y="210" width="330" height="210" rx="18" fill="#5d5200" stroke="#ffc400" stroke-width="3"/><text class="m" x="778" y="248" fill="white" font-size="17">CYD  ESP32-2432S028R</text><text class="m" x="778" y="326" fill="#b6ff00" font-size="17">GPIO 27 (CN1)</text><text class="m" x="778" y="386" fill="white" font-size="17">GND</text><rect x="740" y="312" width="18" height="18" fill="#b6ff00"/><rect x="740" y="374" width="18" height="18" fill="#9aa5ae"/>
<rect class="b" x="768" y="448" width="310" height="124" rx="12"/><text class="m" x="790" y="476" fill="#b6ff00" font-size="16">3.3 V boards (ESP32, Pico)</text><text class="m" x="790" y="508" fill="white" font-size="15">TX → GPIO 27 directly</text><text class="m" x="790" y="534" fill="white" font-size="15">GND → GND</text><text class="m muted" x="790" y="558" font-size="15">no resistors</text>
<text class="m muted" x="72" y="548" font-size="15">Only TX and GND. The gauge never transmits back.</text><text class="m muted" x="72" y="574" font-size="15">115200 baud, line ends with \n</text><rect x="64" y="620" width="1072" height="58" rx="10" fill="#29230b" stroke="#ffc400" stroke-width="2"/><path d="M88 666l15-31 15 31z" fill="#ffc400"/><text x="103" y="660" text-anchor="middle" font-weight="bold">!</text><text class="m" x="136" y="655" fill="white" font-size="16">Never connect a 5 V TX straight to GPIO 27 — the ESP32 pin is 3.3 V only.</text><g transform="translate(570 708)" class="m" font-size="15"><path d="M0 0h20" stroke="#4fd2ff" stroke-width="4"/><text x="26" y="5" class="muted">signal</text><path d="M110 0h20" stroke="#9aa5ae" stroke-width="4"/><text x="136" y="5" class="muted">ground</text><path d="M226 0h20" stroke="#ff8a00" stroke-width="4"/><text x="252" y="5" class="muted">3.3 V</text><path d="M330 0h20" stroke="#ff2424" stroke-width="4"/><text x="356" y="5" class="muted">5/12 V</text><path d="M446 0h20" stroke="#b6ff00" stroke-width="4"/><text x="472" y="5" class="muted">TX data</text></g></svg>
