name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      # esptool (used to build bootloader.bin) breaks with click >= 8.2:
      #   "ParamType.get_metavar() missing 1 required positional argument: 'ctx'"
      - run: pip install platformio "click<8.2"
      - name: Unit tests (host)
        run: pio test -e native
      - name: Build firmware (both panel variants)
        run: pio run -e esp32dev -e cyd-noinvert -e esp32dev-dim
      - name: Build with every my_sensors.cpp example enabled (PulseInput, ADC helpers)
        env:
          PLATFORMIO_BUILD_FLAGS: -DEXAMPLE_BATTERY_GPIO35=1 -DEXAMPLE_RPM_PULSE_GPIO22=1 -DEXAMPLE_FAKE_VALUES=1
        run: pio run -e esp32dev
      - name: Compile Arduino examples (Uno, Nano, Mega, Leonardo, ESP32)
        run: |
          for ex in examples/*/; do
            n=$(basename "$ex")
            pio ci --board uno --board nanoatmega328 --board megaatmega2560 \
                   --board leonardo --board esp32dev "$ex$n.ino"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            .pio/build/esp32dev/firmware.bin
            .pio/build/cyd-noinvert/firmware.bin
