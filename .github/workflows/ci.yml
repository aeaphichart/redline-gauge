name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      # esptool (used to build bootloader.bin) breaks with click >= 8.2:
      #   "ParamType.get_metavar() missing 1 required positional argument: 'ctx'"
      - run: pip install platformio "click<8.2"
      - name: Unit tests (host)
        run: pio test -e native
      - name: Build firmware (both panel variants)
        run: pio run -e esp32dev -e cyd-noinvert
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            .pio/build/esp32dev/firmware.bin
            .pio/build/cyd-noinvert/firmware.bin
